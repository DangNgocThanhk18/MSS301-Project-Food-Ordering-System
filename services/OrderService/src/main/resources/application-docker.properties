# Profile "docker": tự nạp dữ liệu mẫu từ data-docker.sql khi service khởi động.
# Bảng do Hibernate tạo (ddl-auto=update) -> defer-datasource-initialization
# bắt buộc để script SQL chạy SAU khi bảng đã tồn tại.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-docker.sql
spring.sql.init.encoding=UTF-8

# Trong Docker network, Eureka nằm ở container "discovery-server" (không phải localhost).
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.instance.prefer-ip-address=true
