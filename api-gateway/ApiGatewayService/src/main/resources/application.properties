server.port=8080
spring.application.name=api-gateway

# Route t?i các service (URI lb:// = load-balanced qua Eureka)
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=food-service
spring.cloud.gateway.routes[1].uri=lb://FOOD-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/foods/**

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**

# Categories ?i qua FOOD-SERVICE
spring.cloud.gateway.routes[3].id=category-service
spring.cloud.gateway.routes[3].uri=lb://FOOD-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/categories/**

# Invoices ?i qua ORDER-SERVICE
spring.cloud.gateway.routes[4].id=invoice-service
spring.cloud.gateway.routes[4].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/invoices/**
# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Actuator ? cho phép xem routes
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true